<!doctype html>
<html>
  <head>
    <title>Trips-Traps-Trull</title>
    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzEQ2Ln1pLCCj2aOB3d9MzaikMzMk0-9VsIrj5OHaNjRjDfwh-enq0-02SL9WvijvR5WQ/exec"; // https://script.google.com/macros/s/.../exec

      let player = null,
        c = null,
        g = null;
      let span1 = null,
        status = null;

      // Laud: 3x3 ruudustik canvasel c1 (320x240)
      const X0 = 55,
        Y0 = 15,
        CELL = 70;

      let board = ["_", "_", "_", "_", "_", "_", "_", "_", "_"]; // H = inimene, C = arvuti
      let lastKey = "";
      let holdCounter = 0;
      let busy = false;
      let gameOver = false;
      let gameId = "g" + Date.now();

      function start() {
        player = document.getElementById("v1");
        c = document.getElementById("c1");
        g = c.getContext("2d", { willReadFrequently: true });
        span1 = document.getElementById("s1");
        status = document.getElementById("status");

        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "environment" } })
          .then((stream) => {
            player.srcObject = stream;
          })
          .catch((err) => {
            console.error("Kaamera viga:", err);
          });

        setInterval(capture, 500);
      }

      function capture() {
        if (!player.videoWidth) return;

        g.drawImage(player, 0, 0, c.width, c.height);

        // Loeme iga ruudu keskmise värvi ENNE kui joonistame peale
        let redCells = [];
        let info = "";
        for (let i = 0; i < 9; i++) {
          let cx = X0 + (i % 3) * CELL;
          let cy = Y0 + Math.floor(i / 3) * CELL;
          let d = g.getImageData(cx + 15, cy + 15, 40, 40);

          let totalR = 0,
            totalG = 0,
            totalB = 0;
          let pixels = d.data.length / 4;
          for (let p = 0; p < d.data.length; p += 4) {
            totalR += d.data[p];
            totalG += d.data[p + 1];
            totalB += d.data[p + 2];
          }
          let r = Math.round(totalR / pixels);
          let gr = Math.round(totalG / pixels);
          let b = Math.round(totalB / pixels);

          // Punane = inimese nupp
          if (r > 140 && r > gr * 1.5 && r > b * 1.5) redCells.push(i);
          info += i + ":" + r + "," + gr + "," + b + "  ";
        }
        span1.innerHTML = info;

        drawOverlay(redCells);
        detectMove(redCells);
      }

      function drawOverlay(redCells) {
        // ruudustik
        g.strokeStyle = "white";
        g.lineWidth = 2;
        g.strokeRect(X0, Y0, CELL * 3, CELL * 3);
        for (let k = 1; k < 3; k++) {
          g.beginPath();
          g.moveTo(X0 + k * CELL, Y0);
          g.lineTo(X0 + k * CELL, Y0 + CELL * 3);
          g.moveTo(X0, Y0 + k * CELL);
          g.lineTo(X0 + CELL * 3, Y0 + k * CELL);
          g.stroke();
        }
        // tuvastatud punased ja arvuti sinised täpid
        for (let i = 0; i < 9; i++) {
          let cx = X0 + (i % 3) * CELL + CELL / 2;
          let cy = Y0 + Math.floor(i / 3) * CELL + CELL / 2;
          if (redCells.includes(i)) {
            g.strokeStyle = "red";
            g.lineWidth = 3;
            g.beginPath();
            g.arc(cx, cy, 22, 0, Math.PI * 2);
            g.stroke();
          }
          if (board[i] === "C") {
            g.fillStyle = "blue";
            g.beginPath();
            g.arc(cx, cy, 14, 0, Math.PI * 2);
            g.fill();
          }
        }
      }

      function detectMove(redCells) {
        if (busy || gameOver) return;

        let key = redCells.join(",");
        if (key === lastKey) holdCounter++;
        else {
          lastKey = key;
          holdCounter = 0;
        }
        if (holdCounter !== 3) return; // seis peab püsima ~1.5 sekundit

        let humanNow = board.filter((x) => x === "H").length;
        if (redCells.length !== humanNow + 1) return; // ootame täpselt ühte uut nuppu

        let newCell = redCells.find((i) => board[i] !== "H");
        if (newCell === undefined || board[newCell] === "C") {
          status.innerText = "See ruut on arvuti oma. Vali teine.";
          return;
        }

        board[newCell] = "H";
        askComputer();
      }

      function askComputer() {
        busy = true;
        status.innerText = "Arvuti mõtleb...";

        fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" }, // Lihtsustatud tüüp tagab CORS töö
          body: JSON.stringify({ gameId: gameId, board: board }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.move >= 0) board[data.move] = "C";
            if (data.winner === "H") {
              status.innerText = "Sina võitsid!";
              gameOver = true;
            } else if (data.winner === "C") {
              status.innerText = "Arvuti võitis!";
              gameOver = true;
            } else if (data.winner === "D") {
              status.innerText = "Viik!";
              gameOver = true;
            } else status.innerText = "Arvuti käis (sinine täpp). Sinu käik!";
            busy = false;
          })
          .catch((err) => {
            console.error(err);
            status.innerText = "Serveri viga";
            busy = false;
          });
      }

      function reset() {
        board = ["_", "_", "_", "_", "_", "_", "_", "_", "_"];
        gameOver = false;
        lastKey = "";
        holdCounter = 0;
        gameId = "g" + Date.now();
        status.innerText = "Uus mäng. Tühjenda laud. Sinu käik!";
      }
    </script>
  </head>
  <body onload="start()">
    <video
      id="v1"
      controls
      autoplay
      playsinline
      muted
      style="width: 45%"
    ></video>
    <canvas id="c1" width="320" height="240" style="width: 45%"></canvas><br />

    <span id="s1"></span>

    <hr />

    <p>
      <strong>Juhend:</strong><br />
      Sea joonistatud laud kaamera ees valge ruudustiku sisse.<br />
      Sina käid PUNASTE paberitükkidega, arvuti joonistab SINISE täpi.
    </p>
    <p><b id="status">Sinu käik!</b></p>
    <button onclick="reset()">Uus mäng</button>
  </body>
</html>
