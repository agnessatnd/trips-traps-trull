<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <!-- Tagab õige skaala mobiilseadmetes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trips-Traps-Trull</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 15px;
        text-align: center;
        background-color: #f9f9f9;
      }

      /* Konteiner, mis paigutab kaamera ja canvase kõrvuti või kohakuti */
      .game-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        max-width: 800px;
        margin: 0 auto;
      }

      video,
      canvas {
        width: 100%;
        max-width: 360px; /* Telefonis võtab täislaiuse, suuremal ekraanil piiratud */
        height: auto;
        border-radius: 8px;
        background: #222;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .info-box {
        margin-top: 15px;
        padding: 10px;
        background: white;
        border-radius: 8px;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }

      button {
        padding: 12px 24px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      button:active {
        background-color: #0056b3;
      }

      #s1 {
        display: block;
        font-size: 11px;
        color: #666;
        word-break: break-all;
        margin-top: 10px;
      }
    </style>
    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzEQ2Ln1pLCCj2aOB3d9MzaikMzMk0-9VsIrj5OHaNjRjDfwh-enq0-02SL9WvijvR5WQ/exec";

      let player = null,
        c = null,
        g = null;
      let span1 = null,
        status = null;

      // Sisemine resolutsioon arvutusteks
      const CANVAS_WIDTH = 320;
      const CANVAS_HEIGHT = 240;

      const X0 = 55,
        Y0 = 15,
        CELL = 70;

      let board = ["_", "_", "_", "_", "_", "_", "_", "_", "_"];
      let lastKey = "";
      let holdCounter = 0;
      let busy = false;
      let gameOver = false;
      let gameId = "g" + Date.now();

      function start() {
        player = document.getElementById("v1");
        c = document.getElementById("c1");
        g = c.getContext("2d", { willReadFrequently: true });
        span1 = document.getElementById("s1");
        status = document.getElementById("status");

        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "environment" } })
          .then((stream) => {
            player.srcObject = stream;
          })
          .catch((err) => {
            console.error("Kaamera viga:", err);
            status.innerText = "Kaamerat ei saanud käivitada.";
          });

        setInterval(capture, 500);
      }

      function capture() {
        if (!player.videoWidth) return;

        // Joonistame kaamera kaadri fiksitud tööresolutsiooniga canvasel
        g.drawImage(player, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        let redCells = [];
        let info = "";
        for (let i = 0; i < 9; i++) {
          let cx = X0 + (i % 3) * CELL;
          let cy = Y0 + Math.floor(i / 3) * CELL;
          let d = g.getImageData(cx + 15, cy + 15, 40, 40);

          let totalR = 0,
            totalG = 0,
            totalB = 0;
          let pixels = d.data.length / 4;
          for (let p = 0; p < d.data.length; p += 4) {
            totalR += d.data[p];
            totalG += d.data[p + 1];
            totalB += d.data[p + 2];
          }
          let r = Math.round(totalR / pixels);
          let gr = Math.round(totalG / pixels);
          let b = Math.round(totalB / pixels);

          if (r > 140 && r > gr * 1.5 && r > b * 1.5) redCells.push(i);
          info += i + ":" + r + "," + gr + "," + b + " ";
        }
        span1.innerHTML = info;

        drawOverlay(redCells);
        detectMove(redCells);
      }

      function drawOverlay(redCells) {
        g.strokeStyle = "white";
        g.lineWidth = 2;
        g.strokeRect(X0, Y0, CELL * 3, CELL * 3);
        for (let k = 1; k < 3; k++) {
          g.beginPath();
          g.moveTo(X0 + k * CELL, Y0);
          g.lineTo(X0 + k * CELL, Y0 + CELL * 3);
          g.moveTo(X0, Y0 + k * CELL);
          g.lineTo(X0 + CELL * 3, Y0 + k * CELL);
          g.stroke();
        }

        for (let i = 0; i < 9; i++) {
          let cx = X0 + (i % 3) * CELL + CELL / 2;
          let cy = Y0 + Math.floor(i / 3) * CELL + CELL / 2;
          if (redCells.includes(i)) {
            g.strokeStyle = "red";
            g.lineWidth = 3;
            g.beginPath();
            g.arc(cx, cy, 22, 0, Math.PI * 2);
            g.stroke();
          }
          if (board[i] === "C") {
            g.fillStyle = "blue";
            g.beginPath();
            g.arc(cx, cy, 14, 0, Math.PI * 2);
            g.fill();
          }
        }
      }

      function detectMove(redCells) {
        if (busy || gameOver) return;

        let key = redCells.join(",");
        if (key === lastKey) holdCounter++;
        else {
          lastKey = key;
          holdCounter = 0;
        }
        if (holdCounter !== 3) return;

        let humanNow = board.filter((x) => x === "H").length;
        if (redCells.length !== humanNow + 1) return;

        let newCell = redCells.find((i) => board[i] !== "H");
        if (newCell === undefined || board[newCell] === "C") {
          status.innerText = "See ruut on arvuti oma. Vali teine.";
          return;
        }

        board[newCell] = "H";
        askComputer();
      }

      function askComputer() {
        busy = true;
        status.innerText = "Arvuti mõtleb...";

        fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ gameId: gameId, board: board }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.move >= 0) board[data.move] = "C";
            if (data.winner === "H") {
              status.innerText = "Sina võitsid!";
              gameOver = true;
            } else if (data.winner === "C") {
              status.innerText = "Arvuti võitis!";
              gameOver = true;
            } else if (data.winner === "D") {
              status.innerText = "Viik!";
              gameOver = true;
            } else status.innerText = "Arvuti käis (sinine täpp). Sinu käik!";
            busy = false;
          })
          .catch((err) => {
            console.error(err);
            status.innerText = "Serveri viga";
            busy = false;
          });
      }

      function reset() {
        board = ["_", "_", "_", "_", "_", "_", "_", "_", "_"];
        gameOver = false;
        lastKey = "";
        holdCounter = 0;
        gameId = "g" + Date.now();
        status.innerText = "Uus mäng. Tühjenda laud. Sinu käik!";
      }
    </script>
  </head>
  <body onload="start()">
    <h2>Trips-Traps-Trull</h2>

    <div class="game-container">
      <video id="v1" autoplay playsinline muted></video>
      <canvas id="c1" width="320" height="240"></canvas>
    </div>

    <div class="info-box">
      <p><b id="status">Sinu käik!</b></p>
      <button onclick="reset()">Uus mäng</button>

      <p>
        <strong>Juhend:</strong><br />
        Sea joonistatud laud kaamera ees valge ruudustiku sisse.<br />
        Sina käid PUNASTE paberitükkidega, arvuti joonistab SINISE täpi.
      </p>

      <span id="s1"></span>
    </div>
  </body>
</html>
